<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact — Phan Ngoc Ha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="contact.css">

  <script src="background.js"></script>
  <script src="header.js" defer></script>
  <script src="pages.js" defer></script>
  <script src="contact.js" defer></script>
</head>

<body class="inner-page">
  <div class="sky" aria-hidden="true">
    <div class="home-bg-position">
      <img
        class="home-bg-image"
        src="assets-all/bg.png"
        alt=""
        draggable="false"
      >
    </div>
  </div>

  <header class="inner-header"></header>

  <main class="inner-main contact-page">
<img
  class="contact-hand"
  src="contact/hand-writting.webp"
  alt=""
  aria-hidden="true"
  draggable="false"
>

    <header class="contact-heading">
      <h1>Contact</h1>
    </header>

    <section class="contact-content" aria-labelledby="contact-greeting">
      <h2 id="contact-greeting" class="contact-greeting">
        Let's get in touch!
      </h2>

      <div class="contact-frame">
        <ul class="contact-list">

          <li>
            <a class="contact-item" href="tel:+84961116530">
              <img
                class="contact-icon"
                src="contact/contact-icons/phone-icon.svg"
                alt=""
                width="24"
                height="24"
              >

              <span class="contact-item-copy">
                <span class="contact-label">Phone</span>
                <span class="contact-value">+84 961 116 530</span>
              </span>

              <span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
          </li>

          <li>
            <a
              class="contact-item"
              href="https://www.instagram.com/noa_hpan/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="contact-icon"
                src="contact/contact-icons/ig-icon.svg"
                alt=""
                width="24"
                height="24"
              >

              <span class="contact-item-copy">
                <span class="contact-label">Instagram</span>
                <span class="contact-value">@noa_hpan</span>
              </span>

              <span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
          </li>

          <li>
            <a class="contact-item" href="mailto:Hargoc530@gmail.com">
              <img
                class="contact-icon"
                src="contact/contact-icons/mail-icon.svg"
                alt=""
                width="24"
                height="24"
              >

              <span class="contact-item-copy">
                <span class="contact-label">Email</span>
                <span class="contact-value">Hargoc530@gmail.com</span>
              </span>

              <span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
          </li>

          <li>
            <div class="contact-item contact-item--location">
              <img
                class="contact-icon"
                src="contact/contact-icons/location-icon.svg"
                alt=""
                width="24"
                height="24"
              >

              <span class="contact-item-copy">
                <span class="contact-label">Based in</span>
                <span class="contact-value">
                  Ho Chi Minh City, Vietnam
                </span>
              </span>
            </div>
          </li>

        </ul>
      </div>
    </section>
  </main>
</body>
</html>
